<!doctype html>
<!-- tintin-browser.html — TinTin 浏览器窗口整体页面（2026-09-28 用户裁决：浏览器整体
     按原客户端实现，废弃 harness tab 内嵌）。结构对照 SRC desktop/renderer/src/browser/
     Browser.vue：顶部工具条 + 书签栏（平台/功能扩展——2026-10-26 用户裁决：原左栏改到
     地址栏下方书签栏形态）+ 主区（原生 WebContentsView 经 bounds 同步覆盖 #view-host）
     + 右栏（媒体嗅探位）+ 下载栏。
     桥：复用 preload index.cjs 的 window.dshDesktopBrowser（platforms/loginStatus/
     onDownloadEvent）+ tintinBrowserPage 通道（bounds/nav/open/state）。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>TinTin 浏览器</title>
  <style>
    :root {
      color-scheme: light dark;
      --bar-h: 46px;
      --right-w: 260px;
      --bg: #f7f7f8; --surface: #ffffff; --line: #e4e4e7; --ink: #18181b;
      --muted: #71717a; --primary: #4f7cff; --ok: #16a34a; --bad: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
    button { font: inherit; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141416; --surface: #1e1e20; --line: #333; --ink: #e8e8e6; --muted: #8b8b88; }
    }
    /* ── 工具条 ── */
    #bar { height: var(--bar-h); flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .ic { width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font-size: 15px; }
    .ic:not(:disabled):hover { background: rgba(127,127,127,.15); }
    .ic:disabled { color: var(--muted); opacity: .5; cursor: default; }
    #addr { flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--bg); color: var(--ink); font-size: 12px; outline: none; user-select: text; }
    #addr:focus { border-color: var(--primary); }
    #dlBtn { position: relative; }
    #dlBadge { position: absolute; top: 1px; right: 1px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--primary); color: #fff; font-size: 10px; line-height: 15px; text-align: center; display: none; }
    /* ── 书签栏（平台/功能扩展；2026-10-26 用户裁决：原左栏改地址栏下方书签栏）── */
    #bmbar { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
    .bm-title { flex-shrink: 0; font-size: 11px; color: var(--muted); padding: 0 4px; }
    .bm-sep { flex-shrink: 0; width: 1px; height: 16px; background: var(--line); margin: 0 6px; }
    .plat-btn { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border: 0; border-radius: 13px; background: transparent; color: var(--ink); text-align: left; white-space: nowrap; }
    .plat-btn:hover { background: rgba(127,127,127,.12); }
    .plat-btn.active { background: var(--primary); color: #fff; }
    .plat-badge { width: 18px; height: 18px; flex-shrink: 0; border-radius: 5px; background: rgba(127,127,127,.18); color: var(--ink); font-size: 10px; line-height: 18px; text-align: center; }
    .plat-btn.active .plat-badge { background: rgba(255,255,255,.25); color: #fff; }
    .plat-name { max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .plat-state { flex-shrink: 0; font-size: 10px; color: var(--muted); }
    .plat-btn.active .plat-state { color: rgba(255,255,255,.85); }
    /* ── 主体 ── */
    #body { flex: 1 1 auto; display: flex; min-height: 0; }
    /* ── 主区 ── */
    #main { flex: 1 1 auto; min-width: 0; position: relative; background: var(--bg); }
    .view { position: absolute; inset: 0; display: none; overflow: auto; padding: 16px; }
    .view.active { display: block; }
    #view-host { position: absolute; inset: 0; background: #fff; }
    #hostTip { position: absolute; left: 10px; bottom: 8px; z-index: 2; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; pointer-events: none; }
    .placeholder { padding: 48px 24px; text-align: center; color: var(--muted); }
    .placeholder h3 { color: var(--ink); margin-bottom: 8px; }
    /* ── 右栏 ── */
    #right { width: var(--right-w); flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; }
    #right h4 { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    /* ── 下载栏 ── */
    #shelf { flex-shrink: 0; display: none; flex-direction: column; gap: 6px; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--line); max-height: 132px; overflow-y: auto; }
    .dl { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink); }
    .dl .name { flex: 0 1 auto; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl .track { flex: 1 1 auto; height: 5px; border-radius: 3px; background: rgba(127,127,127,.25); overflow: hidden; }
    .dl .fill { display: block; height: 100%; width: 0; background: var(--primary); }
    .dl.done .fill { background: var(--ok); } .dl.done .meta { color: var(--ok); }
    .dl.error .fill { background: var(--bad); } .dl.error .meta { color: var(--bad); }
    .dl .meta { flex-shrink: 0; min-width: 110px; text-align: right; color: var(--muted); }
    /* ── 小按钮（历史/扩展管理等视图行内按钮；da- 前缀源自已删除的每日素材视图）── */
    .da-btn { height: 22px; padding: 0 8px; border: 0.5px solid var(--line); border-radius: 5px; background: transparent; color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; }
    .da-btn:hover { border-color: var(--primary); color: var(--primary); }
    /* ── 自动上架 ── */
    .al-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .al-badge { padding: 2px 10px; border-radius: 999px; background: #16a34a; color: #fff; font-size: 11px; }
    .al-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
    .al-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .al-btn { height: 26px; padding: 0 12px; border: 0.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
    .al-btn.primary { border: 0; background: var(--primary); color: #fff; font-weight: 600; }
    .al-btn:disabled { opacity: .45; cursor: default; }
    .al-summary { margin-top: 8px; font-size: 12px; color: var(--ink); white-space: pre-wrap; word-break: break-all; }
    .al-error { margin-top: 8px; font-size: 12px; color: #dc2626; white-space: pre-wrap; word-break: break-all; }
    .al-log { height: 180px; overflow-y: auto; font: 11px/1.5 Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; user-select: text; }
    .al-log div { margin: 1px 0; color: var(--ink); }
    /* ── 列表卡（收藏/达人/采集/历史共用）── */
    .li-card { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
    .li-main { flex: 1 1 auto; min-width: 0; }
    .li-name { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .li-sub { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .li-badge { padding: 1px 6px; border-radius: 4px; font-size: 10px; border: 0.5px solid var(--line); color: var(--muted); flex-shrink: 0; }
    .li-btn { height: 24px; padding: 0 10px; border: 0.5px solid var(--line); border-radius: 5px; background: transparent; color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; flex-shrink: 0; }
    .li-btn:hover { border-color: var(--primary); color: var(--primary); }
    .li-btn.danger:hover { border-color: #dc2626; color: #dc2626; }
    .cr-tab { padding: 6px 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
    .cr-tab.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--primary); }
    /* ── 嗅探面板 ── */
    .sn-card { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--surface); }
    .sn-name { font-size: 11px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sn-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .sn-badge { padding: 1px 6px; border-radius: 4px; font-size: 10px; border: 0.5px solid var(--line); color: var(--muted); flex-shrink: 0; }
    .sn-btn { margin-left: auto; height: 20px; padding: 0 8px; border: 0; border-radius: 5px; background: var(--primary); color: #fff; font: inherit; font-size: 11px; cursor: pointer; }
    /* ── 提示条（2026-11-04 限制清除批：动作错误不再静默丢弃）── */
    #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px); max-width: 72%; padding: 6px 14px; border-radius: 8px; background: rgba(20,20,22,.92); color: #fff; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 9; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="bar">
    <button class="ic" id="b-back" title="后退">‹</button>
    <button class="ic" id="b-fwd" title="前进">›</button>
    <button class="ic" id="b-rel" title="刷新">⟳</button>
    <button class="ic" id="b-home" title="主页">⌂</button>
    <input id="addr" spellcheck="false" placeholder="输入网址，回车打开" />
    <button class="ic" id="dlBtn" title="下载">
      ⬇<span id="dlBadge">0</span>
    </button>
  </div>
  <div id="bmbar">
    <span class="bm-title">平台</span>
    <div id="platList" style="display:flex;align-items:center;gap:2px;"></div>
    <span class="bm-sep"></span>
    <span class="bm-title">功能扩展</span>
    <div id="extList" style="display:flex;align-items:center;gap:2px;"></div>
    <span style="flex:1 1 auto;"></span>
    <button class="plat-btn" id="serverBtn" title="打开系统设置中配置的服务端地址"><span class="plat-badge">服</span><span class="plat-name">服务端</span></button>
  </div>
  <div id="body">
    <main id="main">
      <section class="view active" id="view-browser">
        <div id="view-host"></div>
        <div id="hostTip">浏览器</div>
      </section>
      <section class="view" id="view-autolisting">
        <div class="al-head">
          <span style="font-weight:700;">自动上架</span>
          <span style="color:var(--muted);font-size:12px;">操作面板已移至「运营工具 → 自动上架」卡片（2026-09-29 裁决）；浏览器侧只负责抖店登录会话</span>
        </div>
        <div class="al-card">
          <div class="al-label">使用步骤</div>
          <div style="font-size:12px;color:var(--ink);line-height:2;">
            1. 点「打开抖店工作台」→ 在主区登录抖店（会话保存在 fxg 分区，一次登录长期有效）<br />
            2. 回运营工具页 → 「自动上架」卡片 → 校验数据包 → 开始任务<br />
            3. 任务在后台驱动本窗口的抖店页面执行；进度可在运营工具卡片面板查看
          </div>
        </div>
      </section>
      <section class="view" id="view-history">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <span style="font-weight:700;">历史记录</span>
          <span id="hsCount" style="color:var(--muted);font-size:12px;"></span>
          <span style="flex:1 1 auto;"></span>
          <button id="hsRefresh" class="da-btn" style="height:26px;">刷新</button>
        </div>
        <div id="hsList" style="display:flex;flex-direction:column;gap:6px;"></div>
      </section>
      <section class="view" id="view-collect">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <span style="font-weight:700;">素材采集清单</span>
          <span id="clCount2" style="color:var(--muted);font-size:12px;"></span>
        </div>
        <div id="clList2" style="display:flex;flex-direction:column;gap:6px;"></div>
      </section>
      <section class="view" id="view-extensions">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <span style="font-weight:700;">扩展管理</span>
          <span id="extCount" style="color:var(--muted);font-size:12px;"></span>
          <span style="flex:1 1 auto;"></span>
          <button id="extInstall" class="da-btn" style="height:26px;">+ 安装扩展（crx / zip）</button>
        </div>
        <div id="extViewList" style="display:flex;flex-direction:column;gap:6px;"></div>
      </section>
    </main>
    <aside id="right">
      <h4>媒体嗅探 <button id="sniffClear" title="清空当前平台嗅探列表" style="float:right;border:0.5px solid var(--line);border-radius:5px;background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:2px 8px;cursor:pointer;">清空</button></h4>
      <div id="sniffList" style="display:flex;flex-direction:column;gap:6px;"></div>
      <!-- B站下载助手（2026-10-26 复活：SRC SniffTab B站扩展推送区；数据=browser:bili-ext-dl） -->
      <h4 id="biliExtHead" style="display:none;">B站下载助手 <span id="biliExtState" style="float:right;color:var(--muted);font-size:10px;"></span></h4>
      <div id="biliExtList" style="display:none;flex-direction:column;gap:6px;"></div>
      <!-- 抖音分享链接解析（SRC SniffTab dy-parse-section；chrom-douyin 预装扩展能力） -->
      <div id="douyinParseSec" style="display:none;">
        <h4>抖音视频下载助手</h4>
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;">预装扩展能力：粘贴分享链接或口令，解析后自动开始下载（无水印完整视频）</div>
        <input id="dyShare" placeholder="粘贴分享链接或口令（App 内分享→复制链接/口令）" spellcheck="false"
          style="width:100%;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:11px;outline:none;user-select:text;" />
        <button id="dyParseBtn" style="width:100%;height:26px;margin-top:6px;border:0;border-radius:5px;background:var(--primary);color:#fff;font:inherit;font-size:11px;cursor:pointer;">解析下载</button>
        <div id="dyMsg" style="margin-top:6px;font-size:11px;color:var(--muted);user-select:text;"></div>
      </div>
    </aside>
  </div>
  <div id="shelf"></div>
  <div id="toast"></div>
<script>
(function () {
  var bridge = window.dshDesktopBrowser || null
  var page = window.tintinBrowserPage || null
  var platforms = []
  var currentId = null
  var downloads = {}
  var activeViewName = 'browser'

  var $ = function (id) { return document.getElementById(id) }

  // ── 工具条 ──
  function paintBar(st) {
    st = st || {}
    $('b-back').disabled = !st.canBack
    $('b-fwd').disabled = !st.canFwd
    $('b-rel').textContent = st.loading ? '×' : '⟳'
    $('b-rel').title = st.loading ? '停止' : '刷新'
    if (document.activeElement !== $('addr')) $('addr').value = st.url || ''
    var names = { web: '网页浏览器', douyin: '抖音', weixin: '视频号', kuaishou: '快手', xiaohongshu: '小红书', bilibili: 'B站', youtube: 'YouTube', jimeng: '即梦AI', fxg: '抖店' }
    $('hostTip').textContent = (st.platform && (names[st.platform] || st.platform)) || '浏览器'
  }

  // 提示条（2026-11-04 限制清除批）：动作失败不再静默——错误/提示统一上屏
  var toastTimer = null
  function toast(msg) {
    var t = $('toast')
    t.textContent = msg
    t.classList.add('show')
    if (toastTimer) clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { t.classList.remove('show') }, 3200)
  }
  function nav(type, url) {
    if (!page) { toast('浏览器桥未接通（页面桥缺失），请重启应用'); return }
    page.action({ type: type, url: url }).then(function (r) {
      if (r && r.ok === false) toast(r.error || '操作失败')
    }).catch(function (e) { toast('操作失败：' + ((e && e.message) || e)) })
  }

  $('b-back').onclick = function () { nav('back') }
  $('b-fwd').onclick = function () { nav('forward') }
  $('b-rel').onclick = function () { nav(relState === 'loading' ? 'stop' : 'reload') }
  $('b-home').onclick = function () { nav('home') }
  // 地址栏归一（2026-11-04 限制清除批）：显式 http(s) 直过；域名/IP/localhost 补协议；
  // 其余输入不再硬拼 https://（无效主机白屏），按关键词走搜索兜底。
  function normalizeAddress(v) {
    if (/^https?:\/\//i.test(v)) return v
    if (/^localhost(:\d+)?([/?#].*)?$/i.test(v)) return 'http://' + v
    if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?([/?#].*)?$/.test(v)) return 'http://' + v
    if (/^[^\s/?#]+\.[^\s/?#]+(:\d+)?([/?#].*)?$/.test(v)) return 'https://' + v
    return 'https://www.baidu.com/s?wd=' + encodeURIComponent(v)
  }
  $('addr').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return
    var v = this.value.trim()
    if (v) nav('go', normalizeAddress(v))
    this.blur()
  })
  var relState = ''

  // ── 左栏：平台 + 功能扩展 ──
  var EXT_ITEMS = [
    { id: 'autolisting', name: '自动上架', badge: '⬆' },
    { id: 'collect', name: '素材采集', badge: '🧺' },
    { id: 'extensions', name: '扩展管理', badge: '🧩' },
  ]
  function paintSidebar() {
    var list = $('platList')
    list.textContent = ''
    platforms.forEach(function (p) {
      var b = document.createElement('button')
      b.className = 'plat-btn' + (currentId === p.id ? ' active' : '')
      b.innerHTML = '<span class="plat-badge"></span><span class="plat-name"></span><span class="plat-state"></span>'
      b.querySelector('.plat-badge').textContent = (p.name || p.id).slice(0, 1)
      b.querySelector('.plat-name').textContent = p.name
      var st = b.querySelector('.plat-state')
      var n = (window.__loginCounts || {})[p.id] || 0
      st.textContent = n > 0 ? '已登录' : '未登录'
      b.onclick = function () {
        switchView('browser')
        // 嗅探目标跟随当前平台（2026-11-04 修复：原调用误在构建循环里执行，恒锁最后一个平台）
        sniffWatch(p.id)
        if (page) page.open({ platform: p.id })
      }
      list.appendChild(b)
    })
    var ext = $('extList')
    ext.textContent = ''
    EXT_ITEMS.forEach(function (it) {
      var b = document.createElement('button')
      b.className = 'plat-btn' + (activeViewName === it.id ? ' active' : '')
      b.innerHTML = '<span class="plat-badge"></span><span class="plat-name"></span>'
      b.querySelector('.plat-badge').textContent = it.badge
      b.querySelector('.plat-name').textContent = it.name
      b.onclick = function () { switchView(it.id) }
      ext.appendChild(b)
    })
  }
  function switchView(name) {
    activeViewName = name
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + name) })
    paintSidebar()
    sendBounds()
    if (name === 'collect') clLoad()
    else if (name === 'history') hsLoad()
    else if (name === 'extensions') extMgrLoad()
  }

  $('serverBtn').onclick = function () {
    // 2026-11-04 收尾：按按钮标题语义打开配置的服务端地址（壳侧 web 分区承载）；未配置时壳侧
    // 返回错误文案，经 nav 统一上屏。原 SRC「系外浏览器提示位」死端退役。
    nav('server')
  }

  // ── 登录态 ──
  function refreshLogin() {
    if (!bridge) return
    bridge.loginStatus().then(function (st) {
      window.__loginCounts = st.counts || {}
      paintSidebar()
    }).catch(function () { /* 桥不可达保持原状 */ })
  }

  // ── 下载栏 ──
  function fmtSpeed(n) {
    if (!n || n <= 0) return ''
    return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB/s' : Math.round(n / 1024) + ' KB/s'
  }
  function paintShelf() {
    var list = Object.keys(downloads).map(function (k) { return downloads[k] })
    var active = list.filter(function (d) { return d.state === 'downloading' || d.state === 'paused' }).length
    var badge = $('dlBadge')
    badge.style.display = active > 0 ? 'block' : 'none'
    badge.textContent = String(active)
    var el = $('shelf')
    if (!list.length) { el.style.display = 'none'; el.textContent = ''; return }
    el.style.display = 'flex'
    el.textContent = ''
    list.forEach(function (d) {
      var row = document.createElement('div')
      row.className = 'dl ' + d.state
      var meta = d.state === 'downloading' ? (d.percent + '%' + (fmtSpeed(d.speed) ? ' · ' + fmtSpeed(d.speed) : ''))
        : d.state === 'paused' ? ('已暂停 ' + d.percent + '%')
        : d.state === 'done' ? '已完成 ✓' : '下载失败'
      row.innerHTML = '<span class="name"></span><span class="track"><span class="fill"></span></span><span class="meta"></span>'
      row.querySelector('.name').textContent = d.file || '下载文件'
      row.querySelector('.fill').style.width = Math.max(0, Math.min(100, d.percent)) + '%'
      row.querySelector('.meta').textContent = meta
      el.appendChild(row)
    })
  }
  if (bridge) {
    bridge.onDownloadEvent({
      progress: function (p) { downloads[p.taskId] = { file: p.file || '下载文件', percent: p.percent || 0, speed: p.speed || 0, state: p.state === 'paused' ? 'paused' : 'downloading' }; paintShelf() },
      done: function (p) { downloads[p.taskId] = { file: p.file || '下载文件', percent: 100, state: 'done' }; paintShelf(); setTimeout(function () { delete downloads[p.taskId]; paintShelf() }, 4000) },
      error: function (p) { downloads[p.taskId] = { file: p.file || '下载文件', percent: 0, state: 'error' }; paintShelf(); setTimeout(function () { delete downloads[p.taskId]; paintShelf() }, 4000) },
    })
  }

  // ── bounds 同步：原生视图覆盖 #view-host ──
  function sendBounds() {
    if (!page) return
    if (activeViewName !== 'browser') { page.bounds({ x: 0, y: 0, width: 0, height: 0 }); return }
    var r = $('view-host').getBoundingClientRect()
    page.bounds({ x: r.x, y: r.y, width: r.width, height: r.height })
  }
  if (window.ResizeObserver) new ResizeObserver(sendBounds).observe($('view-host'))
  window.addEventListener('resize', sendBounds)

  // ── 主进程状态推送 ──
  if (page) page.onState(function (st) { relState = st.loading ? 'loading' : ''; paintBar(st) })

  // ── 媒体嗅探（SRC SniffTab；壳侧 webRequest 采集，按当前平台拉取）──
  var sniffPlatform = ''
  var sniffTimer = null
  var sniffBusy = {}
  function sniffType(t) { return t === 'audio' ? '音频' : '视频' }
  function sniffRender(items) {
    var list = document.getElementById('sniffList')
    list.textContent = ''
    if (!items.length) {
      var empty = document.createElement('div')
      empty.style.cssText = 'color:var(--muted);font-size:11px;padding:10px 2px;text-align:center;'
      empty.textContent = '当前平台暂无嗅探到的媒体（播放视频时自动捕获）'
      list.appendChild(empty)
      return
    }
    items.forEach(function (m) {
      var card = document.createElement('div'); card.className = 'sn-card'
      var nm = document.createElement('div'); nm.className = 'sn-name'; nm.textContent = m.displayName || m.url; nm.title = m.url
      var meta = document.createElement('div'); meta.className = 'sn-meta'
      var badge = document.createElement('span'); badge.className = 'sn-badge'; badge.textContent = sniffType(m.type)
      var btn = document.createElement('button'); btn.className = 'sn-btn'; btn.textContent = sniffBusy[m.url] ? '下载中…' : '下载'
      btn.onclick = function () {
        if (!bridge || sniffBusy[m.url]) return
        sniffBusy[m.url] = true; btn.textContent = '下载中…'
        bridge.sniffDownload({ url: m.url }).then(function (r) {
          sniffBusy[m.url] = false; btn.textContent = r && r.success ? '已提交 ✓' : '失败'
          setTimeout(function () { btn.textContent = '下载' }, 2500)
        }).catch(function () { sniffBusy[m.url] = false; btn.textContent = '失败' })
      }
      meta.append(badge, btn)
      card.append(nm, meta)
      list.appendChild(card)
    })
  }
  function sniffTick() {
    if (!bridge || !sniffPlatform) return
    bridge.sniffList(sniffPlatform).then(function (r) {
      sniffRender((r && r.data) || [])
    }).catch(function () { /* 桥不可达保持原状 */ })
  }
  function sniffWatch(platform) {
    sniffPlatform = platform || ''
    sniffTick()
    // 下载扩展链分区联动（2026-10-26 复活）：B站=扩展推送下载列表；抖音=分享链接解析
    var isBili = platform === 'bilibili'
    var isDy = platform === 'douyin'
    document.getElementById('biliExtHead').style.display = isBili ? 'block' : 'none'
    document.getElementById('biliExtList').style.display = isBili ? 'flex' : 'none'
    document.getElementById('douyinParseSec').style.display = isDy ? 'block' : 'none'
    if (isBili) biliExtRender()
  }
  document.getElementById('sniffClear').onclick = function () {
    if (bridge && sniffPlatform) bridge.sniffClear(sniffPlatform).then(sniffTick).catch(function () {})
  }
  sniffTimer = setInterval(sniffTick, 2000)

  // ── 下载扩展链（2026-10-26 复活；SRC SniffTab 扩展推送区 + downloadBiliExtLink +
  //    douyinParseDownload + 扩展管理浮面板，统一并入本页面）──
  // B站下载助手推送（browser:bili-ext-dl：console 捕获 + 2s 轮询双通道，主进程去重后推送）
  var biliExt = { title: '', items: [] }
  var biliBusy = {}
  function biliExtRender() {
    var head = document.getElementById('biliExtState')
    head.textContent = biliExt.items.length ? (biliExt.title ? biliExt.items.length + ' 条 · ' + biliExt.title : biliExt.items.length + ' 条') : '播放视频后由扩展解析下载地址…'
    var list = document.getElementById('biliExtList')
    list.textContent = ''
    if (!biliExt.items.length) return
    biliExt.items.forEach(function (dl) {
      var card = document.createElement('div'); card.className = 'sn-card'
      var nm = document.createElement('div'); nm.className = 'sn-name'; nm.textContent = dl.text || dl.url; nm.title = dl.url
      var meta = document.createElement('div'); meta.className = 'sn-meta'
      var badge = document.createElement('span'); badge.className = 'sn-badge'; badge.textContent = dl.sizeText || (dl.audioUrl ? '音视频' : '视频')
      var btn = document.createElement('button'); btn.className = 'sn-btn'; btn.textContent = biliBusy[dl.url] ? '下载中…' : '下载'
      btn.onclick = function () {
        if (!bridge || biliBusy[dl.url]) return
        biliBusy[dl.url] = true; btn.textContent = '下载中…'
        // SRC downloadBiliExtLink 口径：直链 + Referer=当前页 + 音视频分离时双流下载 FFmpeg 合并
        bridge.downloadMediaStart({
          url: dl.url,
          ...(dl.audioUrl ? { audioUrl: dl.audioUrl } : {}),
          title: dl.text || '',
          filename: dl.download || dl.text || 'video.mp4',
          referer: $('addr').value || 'https://www.bilibili.com/',
          platformId: 'bilibili',
          subDir: 'bilibili',
          useYtdlp: false,
        }).then(function (r) {
          biliBusy[dl.url] = false
          btn.textContent = r && r.success ? '已提交 ✓' : '失败'
          setTimeout(function () { btn.textContent = '下载' }, 2500)
        }).catch(function () { biliBusy[dl.url] = false; btn.textContent = '失败' })
      }
      meta.append(badge, btn)
      card.append(nm, meta)
      list.appendChild(card)
    })
  }
  if (bridge && bridge.onBiliExtDownloads) {
    bridge.onBiliExtDownloads(function (msg) {
      var payload = (msg && msg.payload) || {}
      biliExt.title = payload.title || ''
      biliExt.items = Array.isArray(payload.downloads) ? payload.downloads : []
      if (sniffPlatform === 'bilibili') biliExtRender()
    })
  }
  // 抖音分享链接解析（SRC douyinParseDownload：主链路 videoPageUrl→yt-dlp；API 兜底直链）
  function dySetMsg(ok, text) {
    var el = document.getElementById('dyMsg')
    el.style.color = ok ? 'var(--ok)' : 'var(--bad)'
    el.textContent = text
  }
  function dyParse() {
    if (!bridge) { dySetMsg(false, '桥不可达（客户端需更新）'); return }
    var text = document.getElementById('dyShare').value.trim()
    if (!text) { dySetMsg(false, '先粘贴抖音分享链接或口令'); return }
    var btn = document.getElementById('dyParseBtn')
    btn.disabled = true; btn.textContent = '解析中…'; dySetMsg(true, '')
    bridge.douyinParse(text).then(function (r) {
      btn.disabled = false; btn.textContent = '解析下载'
      // 失败原因 toast 上屏（2026-11-04：原只有 11px 小红字，面板窄时不可见=「没反应」错觉）
      if (!r || !r.ok) { var m = (r && r.reason) || '解析失败'; dySetMsg(false, m); toast(m); return }
      var baseName = String(r.desc || r.author || ('douyin_video_' + Date.now())).slice(0, 40).replace(/[\\/:*?"<>|\s]+/g, '_') || ('douyin_video_' + Date.now())
      var params = r.videoPageUrl
        ? { url: r.videoPageUrl, filename: baseName + '.mp4', referer: 'https://www.douyin.com/', platformId: 'douyin', subDir: 'douyin', useYtdlp: true }
        : { url: r.videoUrl, filename: baseName + '.mp4', referer: 'https://www.douyin.com/', platformId: 'douyin', subDir: 'douyin', useYtdlp: false }
      return bridge.downloadMediaStart(params).then(function (d) {
        var ok = !!(d && d.success)
        dySetMsg(ok, ok
          ? ('解析成功，已开始下载' + (r.videoPageUrl ? '（无水印完整视频）' : ''))
          : ((d && d.error) || '下载发起失败'))
        if (!ok) toast((d && d.error) || '下载发起失败')
      })
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '解析下载'
      var m = '解析失败：' + (e && e.message || e)
      dySetMsg(false, m); toast(m)
    })
  }
  document.getElementById('dyParseBtn').onclick = dyParse
  document.getElementById('dyShare').addEventListener('keydown', function (e) { if (e.key === 'Enter') dyParse() })
  // 扩展管理（SRC extensions-panel.html：列表/内置标识/安装 crx|zip/卸载；独立浮窗改并入本页面视图）
  var extItems = []
  function extMgrLoad() {
    if (!bridge) return
    bridge.extensionList().then(function (r) {
      extItems = (r && r.success && r.data && Array.isArray(r.data.extensions)) ? r.data.extensions : []
      extMgrRender()
    }).catch(function () { /* 桥不可达保持原状 */ })
  }
  function extMgrRender() {
    document.getElementById('extCount').textContent = extItems.length + ' 个'
    var list = document.getElementById('extViewList')
    list.textContent = ''
    if (!extItems.length) {
      list.appendChild(mkEmpty('未安装任何扩展。点右上角「+ 安装扩展」上传 crx 或 zip；B站/抖音下载助手为内置预装，无需安装。'))
      return
    }
    extItems.forEach(function (e) {
      list.appendChild(liCard({
        name: (e.name || e.id) + (e.version ? ' v' + e.version : ''),
        sub: e.description || e.path || '',
        badge: e.builtin ? '内置' : '已装',
        actions: e.builtin ? [] : [
          { label: '卸载', danger: true, on: function () { if (bridge) bridge.extensionUninstall(e.id).then(extMgrLoad) } },
        ],
      }))
    })
  }
  document.getElementById('extInstall').onclick = function () {
    if (!bridge) return
    bridge.extensionPickAndInstall().then(function (r) {
      if (r && r.success) window.alert(r.message || '已安装')
      else if (r && !r.cancelled) window.alert((r && r.message) || '安装失败')
      extMgrLoad()
    }).catch(function (e) { window.alert('安装失败：' + (e && e.message || e)) })
  }
  if (bridge && bridge.onExtensionsChanged) {
    bridge.onExtensionsChanged(function () { extMgrLoad() })
  }

  // ── 素材采集清单（creators:getCollected；达人库已按 2026-11-04 用户裁决移除，
  // 清单保留为既有采集记录的查看面）──
  var clItems = []
  function clLoad() {
    if (!bridge) return
    bridge.creatorsGetCollected().then(function (r) { clItems = (r && r.data) || []; clRender() }).catch(function () {})
  }
  function clRender() {
    document.getElementById('clCount2').textContent = clItems.length + ' 条'
    var list = document.getElementById('clList2')
    if (!list) return
    list.textContent = ''
    if (!clItems.length) { list.appendChild(mkEmpty('采集清单为空。')); return }
    clItems.slice().reverse().slice(0, 200).forEach(function (it) {
      list.appendChild(liCard({
        name: it.title || it.url, sub: it.creatorName + ' · ' + it.date,
        badge: it.platform,
        actions: [
          { label: '打开', on: function () { if (page) page.action({ type: 'go', url: it.url }) } },
        ],
      }))
    })
  }
  clLoad()

  // ── 历史（SRC 历史面板；media:storage 下载+嗅探记录）──
  function mkEmpty(text) {
    var d = document.createElement('div')
    d.className = 'placeholder'
    d.style.padding = '24px 10px'
    d.textContent = text
    return d
  }
  function liCard(o) {
    var card = document.createElement('div'); card.className = 'li-card'
    var main = document.createElement('div'); main.className = 'li-main'
    var nm = document.createElement('div'); nm.className = 'li-name'; nm.textContent = o.name; nm.title = o.name
    var sub = document.createElement('div'); sub.className = 'li-sub'; sub.textContent = o.sub || ''
    main.append(nm, sub)
    var badge = document.createElement('span'); badge.className = 'li-badge'; badge.textContent = o.badge || ''
    card.append(main, badge)
    ;(o.actions || []).forEach(function (a) {
      var b = document.createElement('button')
      b.className = 'li-btn' + (a.danger ? ' danger' : '')
      b.textContent = a.label
      b.onclick = a.on
      card.appendChild(b)
    })
    return card
  }
  var hsData = { downloads: [], sniffed: [] }
  function hsLoad() {
    if (!bridge) { hsRender(); return }
    Promise.all([bridge.mediaStorageGetDownloads(), bridge.mediaStorageGetSniffed()]).then(function (rs) {
      hsData.downloads = (rs[0] && rs[0].success && Array.isArray(rs[0].data)) ? rs[0].data : []
      hsData.sniffed = (rs[1] && rs[1].success && Array.isArray(rs[1].data)) ? rs[1].data : []
      hsRender()
    }).catch(function () { hsRender() })
  }
  function hsRender() {
    document.getElementById('hsCount').textContent = '下载 ' + hsData.downloads.length + ' · 嗅探 ' + hsData.sniffed.length
    var list = document.getElementById('hsList')
    list.textContent = ''
    if (!hsData.downloads.length && !hsData.sniffed.length) { list.appendChild(mkEmpty('暂无记录（抽取/下载后在此显示）')); return }
    hsData.downloads.slice(0, 30).forEach(function (d) {
      list.appendChild(liCard({
        name: d.name || d.fileName || d.id, sub: (d.path || '') + (d.size ? ' · ' + d.size + 'B' : ''),
        badge: '下载', actions: [{ label: '定位', on: function () { if (d.path && bridge) bridge.revealDailyAsset(d.path) } }],
      }))
    })
    hsData.sniffed.slice(0, 30).forEach(function (m) {
      list.appendChild(liCard({ name: m.name || m.url, sub: m.url || '', badge: m.type === 'audio' ? '音频' : '嗅探' }))
    })
  }
  document.getElementById('hsRefresh').onclick = function () { hsLoad() }
  hsLoad()

  // ── 启动 ──
  if (bridge) {
    bridge.platforms().then(function (list) {
      platforms = Array.isArray(list) ? list : []
      paintSidebar()
      refreshLogin()
    }).catch(function () { paintSidebar() })
  } else {
    paintSidebar()
  }
  sendBounds()
  setInterval(refreshLogin, 15000)
})()
</script>
</body>
</html>
