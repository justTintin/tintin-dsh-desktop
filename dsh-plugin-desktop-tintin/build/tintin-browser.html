<!doctype html>
<!-- tintin-browser.html — TinTin 浏览器窗口整体页面（2026-09-28 用户裁决：浏览器整体
     按原客户端实现，废弃 harness tab 内嵌）。结构对照 SRC desktop/renderer/src/browser/
     Browser.vue：顶部工具条 + 书签栏（平台/功能扩展——2026-10-26 用户裁决：原左栏改到
     地址栏下方书签栏形态）+ 主区（原生 WebContentsView 经 bounds 同步覆盖 #view-host）
     + 右栏（媒体嗅探位）+ 下载栏。
     桥：复用 preload index.cjs 的 window.dshDesktopBrowser（platforms/loginStatus/
     onDownloadEvent）+ tintinBrowserPage 通道（bounds/nav/open/state）。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>TinTin 浏览器</title>
  <style>
    /* ═══ 设计 tokens（2026-11-08 全面美化：对齐视频剪辑 Luosiding 设计系统 ═══
       调色板=indigo 品牌蓝 + slate 中性阶；暗色中性面/字/边逐值对齐原生
       dsw-alias（design-platform.css：layer-1=875 #232324 / layer-2=850 #2c2c2e /
       layer-3=800 #353538 / base=950 #151517 / label-primary=bluish-50
       / label-secondary=bluish-300 / border=白 6%·8%），浏览器页是独立 webview
       载体（宿主 alias 变量不注入），故按宿主值静态落地、以 [data-theme] 切档。 */
    :root {
      color-scheme: light dark;
      --bar-h: 46px;
      --right-w: 264px;
      /* 亮色档 */
      --bg: #f0f1f7;          /* slate-50 */
      --surface: #ffffff;      /* slate-0 */
      --surface-2: #e9ecf2;    /* bluish-150 浮起 */
      --line: rgba(0,0,0,.08);
      --line-strong: rgba(0,0,0,.12);
      --ink: #0f1115;          /* bluish-1000 */
      --ink-2: #43464e;        /* bluish-700 级 */
      --muted: #52555f;
      --primary: #4f46e5;      /* indigo-500 */
      --primary-hover: #4338ca;
      --primary-soft: rgba(79, 70, 229, .10);
      --accent: #8b5cf6;       /* violet-500 */
      --ok: #10b981; --bad: #ef4444; --star: #f59e0b;
      --radius: 10px; --radius-l: 12px; --radius-s: 8px;
      --easing: cubic-bezier(0.4, 0, 0.2, 1);
      --easing-out: cubic-bezier(0, 0, 0.2, 1);
      --shadow-1: 0 1px 3px rgba(11,12,16,.08);
      --shadow-3: 0 8px 24px rgba(11,12,16,.16);
      --wash: rgba(255,255,255,.62);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme='light']) { --tk-dark: 1; }
    }
    /* 暗色档（原生 dsw-alias 逐值；auto=媒体查询、手动=html[data-theme]） */
    @media (prefers-color-scheme: dark) {
      html:not([data-theme='light']) {
        --bg: #151517;         /* bluish-950 */
        --surface: #232324;    /* bluish-875 layer-1 */
        --surface-2: #2c2c2e;  /* bluish-850 layer-2 */
        --surface-3: #353538;  /* bluish-800 layer-3 */
        --line: rgba(255,255,255,.06);
        --line-strong: rgba(255,255,255,.10);
        --ink: #f0f1f5;        /* bluish-50 label-primary */
        --ink-2: #cfd3d6;      /* bluish-300 label-secondary */
        --muted: #9ba3ac;
        --primary: #6366f1;    /* indigo-400（暗色提档） */
        --primary-hover: #818cf8;
        --primary-soft: rgba(99, 102, 241, .16);
        --accent: #a78bfa;
        --ok: #34d399; --bad: #f87171; --star: #fbbf24;
        --shadow-1: 0 1px 3px rgba(0,0,0,.4);
        --shadow-3: 0 8px 24px rgba(0,0,0,.5);
        --wash: rgba(13,16,24,.58);
      }
    }
    html[data-theme='dark'] {
      --bg: #151517; --surface: #232324; --surface-2: #2c2c2e; --surface-3: #353538;
      --line: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.10);
      --ink: #f0f1f5; --ink-2: #cfd3d6; --muted: #9ba3ac;
      --primary: #6366f1; --primary-hover: #818cf8; --primary-soft: rgba(99,102,241,.16);
      --accent: #a78bfa; --ok: #34d399; --bad: #f87171; --star: #fbbf24;
      --shadow-1: 0 1px 3px rgba(0,0,0,.4);
      --shadow-3: 0 8px 24px rgba(0,0,0,.5);
      --wash: rgba(13,16,24,.58);
      color-scheme: dark;
    }
    html[data-theme='light'] { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
    button { font: inherit; cursor: pointer; color: var(--ink); }
    /* 滚动条（对齐原生细滚动条） */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    ::-webkit-scrollbar-track { background: transparent; }
    /* ── 工具条（表面+柔和阴影）── */
    #bar { height: var(--bar-h); flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-1); z-index: 3; }
    .ic { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-size: 15px; transition: background .15s var(--easing), transform .15s var(--easing); }
    .ic:not(:disabled):hover { background: var(--primary-soft); }
    .ic:not(:disabled):active { transform: scale(.94); }
    .ic:disabled { color: var(--muted); opacity: .45; cursor: default; }
    #addr { flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--bg); color: var(--ink); font-size: 12px; outline: none; user-select: text; transition: border-color .15s var(--easing), box-shadow .15s var(--easing); }
    #addr:hover { border-color: var(--line-strong); }
    #addr:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    #dlBtn { position: relative; }
    /* ── 标签栏（2026-11-08 第二批 #2）+ 地址栏星标（#4）── */
    #tabbar { display: none; flex-shrink: 0; align-items: center; gap: 4px; padding: 3px 10px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
    .tb-tab { display: inline-flex; align-items: center; gap: 5px; max-width: 160px; height: 26px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font: inherit; font-size: 11px; cursor: pointer; flex-shrink: 0; transition: background .15s var(--easing), color .15s var(--easing); }
    .tb-tab:hover { background: var(--primary-soft); color: var(--ink); }
    .tb-tab.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
    .tb-tab .tt { max-width: 118px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tb-tab .tx { width: 14px; height: 14px; line-height: 13px; border-radius: 4px; text-align: center; flex-shrink: 0; font-size: 10px; }
    .tb-tab .tx:hover { background: rgba(127,127,127,.3); }
    #tbNew { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font-size: 14px; cursor: pointer; flex-shrink: 0; }
    #tbNew:hover { background: rgba(127,127,127,.18); }
    #starBtn { width: 26px; flex-shrink: 0; color: var(--muted); }
    #starBtn.starred { color: var(--star); }
    /* ── 地址栏历史建议（2026-11-08 第二批 #3）── */
    #addrSug { display: none; position: absolute; top: 40px; left: 108px; right: 60px; z-index: 6; border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--surface); box-shadow: var(--shadow-3); overflow: hidden; }
    #addrSug .sg { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--ink); cursor: pointer; }
    #addrSug .sg:hover, #addrSug .sg.hl { background: rgba(127,127,127,.15); }
    #addrSug .sg .st { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #addrSug .sg .su { flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    #addrWrap { position: relative; flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
    #dlBadge { position: absolute; top: 1px; right: 1px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--primary); color: #fff; font-size: 10px; line-height: 15px; text-align: center; display: none; }
    /* ── 书签栏（平台/功能扩展；2026-10-26 用户裁决：原左栏改地址栏下方书签栏）── */
    #bmbar { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
    .bm-title { flex-shrink: 0; font-size: 11px; color: var(--muted); padding: 0 4px; }
    .bm-sep { flex-shrink: 0; width: 1px; height: 16px; background: var(--line); margin: 0 6px; }
    .plat-btn { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border: 0; border-radius: 13px; background: transparent; color: var(--ink); text-align: left; white-space: nowrap; transition: background .15s var(--easing); }
    .plat-btn:hover { background: var(--primary-soft); }
    .plat-btn.active { background: var(--primary); color: #fff; box-shadow: var(--shadow-1); }
    .plat-badge { width: 18px; height: 18px; flex-shrink: 0; border-radius: 5px; background: var(--primary-soft); color: var(--ink); font-size: 10px; line-height: 18px; text-align: center; }
    .plat-btn.active .plat-badge { background: rgba(255,255,255,.25); color: #fff; }
    .plat-name { max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .plat-state { flex-shrink: 0; font-size: 10px; color: var(--muted); }
    .plat-btn.active .plat-state { color: rgba(255,255,255,.85); }
    /* ── 主体 ── */
    #body { flex: 1 1 auto; display: flex; min-height: 0; }
    /* ── 主区 ── */
    #main { flex: 1 1 auto; min-width: 0; position: relative; background: var(--bg); }
    .view { position: absolute; inset: 0; display: none; overflow: auto; padding: 16px; }
    .view.active { display: block; animation: view-in .28s var(--easing-out) backwards; }
    @keyframes view-in { from { opacity: 0; transform: translateY(6px); } }
    #view-host { position: absolute; inset: 0; background: var(--bg); }
    #hostTip { position: absolute; left: 10px; bottom: 8px; z-index: 2; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 72%, transparent); color: var(--surface); font-size: 11px; pointer-events: none; backdrop-filter: blur(4px); }
    .placeholder { padding: 48px 24px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .placeholder h3 { color: var(--ink); margin-bottom: 8px; }
    /* ── 右栏（两区结构，2026-11-12 下载栏归位：滚动区 + 常驻底区）── */
    #right { width: var(--right-w); flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
    #rightScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px; }
    #right h4 { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
    /* ── 下载栏（右栏底部锚定，2026-11-12 用户裁决：不再横贯整个界面底部）── */
    #shelf { flex-shrink: 0; display: none; flex-direction: column; gap: 6px; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--line); max-height: 132px; overflow-y: auto; }
    .dl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--ink); }
    .dl .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 进度条独占一行（2026-11-13 用户报障）：原行内三段布局在窄窗口下 track 被
       name(42%)+meta(110px) 挤没——进度只剩文字。改两行式：信息行+全宽进度条。 */
    .dl .track { flex: 1 1 100%; height: 5px; border-radius: 3px; background: rgba(127,127,127,.25); overflow: hidden; }
    .dl .fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .3s var(--easing-out); }
    .dl.done .fill { background: var(--ok); } .dl.done .meta { color: var(--ok); }
    .dl.error .fill { background: var(--bad); } .dl.error .meta { color: var(--bad); }
    .dl .meta { flex-shrink: 0; min-width: 110px; text-align: right; color: var(--muted); }
    /* ── 小按钮（历史/扩展管理等视图行内按钮；da- 前缀源自已删除的每日素材视图）── */
    .da-btn { height: 22px; padding: 0 8px; border: 0.5px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; transition: border-color .15s var(--easing), background .15s var(--easing), color .15s var(--easing); }
    .da-btn:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    /* ── 自动上架 ── */
    .al-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .al-badge { padding: 2px 10px; border-radius: 999px; background: #16a34a; color: #fff; font-size: 11px; }
    .al-card { border: 1px solid var(--line); border-radius: var(--radius-l); padding: 11px 13px; margin-bottom: 10px; background: var(--surface); }
    .al-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .al-btn { height: 26px; padding: 0 12px; border: 0.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
    .al-btn.primary { border: 0; background: var(--primary); color: #fff; font-weight: 600; box-shadow: var(--shadow-1); transition: background .15s var(--easing), transform .15s var(--easing), box-shadow .15s var(--easing); }
    .al-btn.primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-3); }
    .al-btn.primary:not(:disabled):active { transform: scale(.97); }
    .al-btn:disabled { opacity: .45; cursor: default; }
    .al-summary { margin-top: 8px; font-size: 12px; color: var(--ink); white-space: pre-wrap; word-break: break-all; }
    .al-error { margin-top: 8px; font-size: 12px; color: #dc2626; white-space: pre-wrap; word-break: break-all; }
    .al-log { height: 180px; overflow-y: auto; font: 11px/1.5 Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; user-select: text; }
    .al-log div { margin: 1px 0; color: var(--ink); }
    /* ── 列表卡（收藏/达人/采集/历史共用）── */
    .li-card { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 11px; background: var(--surface); transition: border-color .15s var(--easing), box-shadow .15s var(--easing); }
    .li-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
    .li-main { flex: 1 1 auto; min-width: 0; }
    .li-name { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .li-sub { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .li-badge { padding: 1px 6px; border-radius: 4px; font-size: 10px; border: 0.5px solid var(--line); color: var(--muted); flex-shrink: 0; }
    .li-btn { height: 24px; padding: 0 10px; border: 0.5px solid var(--line); border-radius: 5px; background: transparent; color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; flex-shrink: 0; }
    .li-btn:hover { border-color: var(--primary); color: var(--primary); }
    .li-btn.danger:hover { border-color: #dc2626; color: #dc2626; }
    .cr-tab { padding: 6px 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
    .cr-tab.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--primary); }
    /* ── 嗅探面板 ── */
    .sn-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; background: var(--surface); transition: border-color .15s var(--easing); }
    .sn-card:hover { border-color: var(--line-strong); }
    .sn-name { font-size: 11px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sn-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .sn-badge { padding: 1px 6px; border-radius: 4px; font-size: 10px; border: 0.5px solid var(--line); color: var(--muted); flex-shrink: 0; white-space: nowrap; }
    .sn-btn { margin-left: auto; height: 20px; padding: 0 8px; border: 0; border-radius: 6px; background: var(--primary); color: #fff; font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background .15s var(--easing), transform .15s var(--easing); }
    /* 列表容器显式宽度（2026-11-12 实机诊断：解析期 display:none 的 flex 列容器在
       none→flex 翻转后 Chromium 可能把 auto 宽钉死为 0——宽度塌缩，卡片/按钮被挤成
       竖排（Playwright 三方复现：原节点 0px/克隆 239px/width:100% 修复 239px）；
       解析期即 flex 的 #sniffList 从未塌缩，同为 none 起步的 #biliExtList/#dyStreams
       显式 width 绕开 auto 计算路径。） */
    #sniffList, #biliExtList, #dyStreams { width: 100%; }
    .sn-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .sn-btn:not(:disabled):active { transform: scale(.96); }
    .sn-btn:disabled { opacity: .55; cursor: default; }
    /* 主按钮（解析/下载视频；indigo 底+hover 抬升+按压缩放，视频剪辑按钮族同语义） */
    .btn-primary { display: block; width: 100%; border: 0; border-radius: var(--radius-s); background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-1); transition: background .15s var(--easing), box-shadow .15s var(--easing), transform .15s var(--easing); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-3); }
    .btn-primary:not(:disabled):active { transform: scale(.97); }
    .btn-primary:disabled { opacity: .55; cursor: default; }
    /* ── 设置页（2026-11-08 第一批 P0「设置入口」）── */
    .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .set-row > label:first-child { width: 96px; flex-shrink: 0; font-size: 12px; color: var(--muted); }
    .set-row input[type="text"], .set-row input:not([type]), .set-row select { height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; outline: none; }
    .set-hint { font-size: 11px; color: var(--muted); }
    /* ── 页内查找条（2026-11-08 第一批 P0 #5）── */
    #findBar { display: none; position: absolute; top: 8px; right: 16px; z-index: 5; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-3); }
    #findBar input { width: 160px; height: 24px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; outline: none; }
    #findBar button { height: 24px; min-width: 24px; padding: 0 6px; border: 0.5px solid var(--line); border-radius: 5px; background: transparent; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
    #findCount { font-size: 11px; color: var(--muted); min-width: 36px; text-align: center; }
    /* ── 提示条（2026-11-04 限制清除批：动作错误不再静默丢弃）── */
    #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px); max-width: 72%; padding: 6px 14px; border-radius: 8px; background: rgba(20,20,22,.92); color: #fff; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 9; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="tbTabs" style="display:flex;align-items:center;gap:4px;"></div>
    <button id="tbNew" title="新建标签（当前平台）">＋</button>
    <span style="flex:1 1 auto;"></span>
  </div>
  <div id="bar">
    <button class="ic" id="b-back" title="后退">‹</button>
    <button class="ic" id="b-fwd" title="前进">›</button>

          <label class="set-hint" style="width:auto;"><input type="checkbox" id="setClearCache" checked /> 缓存</label>

          style="width:100%;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:11px;outline:none;user-select:text;" />
        <button id="dyParseBtn" class="btn-primary" style="width:100%;height:28px;margin-top:6px;font-size:12px;">解析</button>

        <!-- 解析/下载分离（2026-11-05 用户裁决）：解析出视频先出结果卡，点「下载视频」才下载；
             无水印徽标独立成行且仅抖音结果展示（通用链无此语义）；捕获流就地展示在本卡内
             （同日裁决：捕获结果归助手卡=下方，顶部嗅探面板抖音隐藏） -->

              <span id="dyBadge" class="sn-badge">无水印</span>
            </div>
            <div id="dyStreams" style="display:none;flex-direction:column;gap:4px;margin-top:6px;"></div>
            <button id="dyDownloadBtn" class="btn-primary" style="width:100%;height:28px;font-size:12px;margin-top:6px;">下载视频</button>

           静态常驻底区，不随 rightScroll 滚动，长短内容都精确钉底） -->

  <div id="toast"></div>
<script>
(function () {
  var bridge = window.dshDesktopBrowser || null
  var page = window.tintinBrowserPage || null
  var platforms = []
  var currentId = null
  var downloads = {}
  var activeViewName = 'browser'

  var $ = function (id) { return document.getElementById(id) }

  // ── 工具条 ──
  function paintBar(st) {
    st = st || {}
    $('b-back').disabled = !st.canBack
    $('b-fwd').disabled = !st.canFwd
    $('b-rel').textContent = st.loading ? '×' : '⟳'
    $('b-rel').title = st.loading ? '停止' : '刷新'
    if (document.activeElement !== $('addr')) $('addr').value = st.url || ''
    var names = { web: '网页浏览器', douyin: '抖音', weixin: '视频号', kuaishou: '快手', xiaohongshu: '小红书', bilibili: 'B站', youtube: 'YouTube', jimeng: '即梦AI', fxg: '抖店' }
    $('hostTip').textContent = (st.platform && (names[st.platform] || st.platform)) || '浏览器'
    $('hostTip').dataset.platform = st.platform || ''
  }

  // 提示条（2026-11-04 限制清除批）：动作失败不再静默——错误/提示统一上屏
  var toastTimer = null
  function toast(msg) {
    var t = $('toast')
    t.textContent = msg
    t.classList.add('show')
    if (toastTimer) clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { t.classList.remove('show') }, 3200)
  }
  function nav(type, url) {
    if (!page) { toast('浏览器桥未接通（页面桥缺失），请重启应用'); return }
    page.action({ type: type, url: url }).then(function (r) {
      if (r && r.ok === false) toast(r.error || '操作失败')
    }).catch(function (e) { toast('操作失败：' + ((e && e.message) || e)) })
  }

  $('b-back').onclick = function () { nav('back') }
  $('b-fwd').onclick = function () { nav('forward') }
  $('b-rel').onclick = function () { nav(relState === 'loading' ? 'stop' : 'reload') }
  $('b-home').onclick = function () { nav('home') }
  // 地址栏归一（2026-11-04 限制清除批）：显式 http(s) 直过；域名/IP/localhost 补协议；
  // 其余输入不再硬拼 https://（无效主机白屏），按关键词走搜索兜底（引擎随设置，11-08 第一批）。
  var SEARCH_BASES = { baidu: 'https://www.baidu.com/s?wd=', bing: 'https://www.bing.com/search?q=', google: 'https://www.google.com/search?q=' }
  var pageSettings = {}
  function normalizeAddress(v) {
    if (/^https?:\/\//i.test(v)) return v
    if (/^localhost(:\d+)?([/?#].*)?$/i.test(v)) return 'http://' + v
    if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?([/?#].*)?$/.test(v)) return 'http://' + v
    if (/^[^\s/?#]+\.[^\s/?#]+(:\d+)?([/?#].*)?$/.test(v)) return 'https://' + v
    return (SEARCH_BASES[pageSettings.searchEngine] || SEARCH_BASES.baidu) + encodeURIComponent(v)
  }
  $('addr').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return
    var v = this.value.trim()
    if (v) nav('go', normalizeAddress(v))
    this.blur()
  })
  var relState = ''

  // ── 主题切换（2026-11-08 用户要求）：auto 跟随系统 / light / dark 三态循环，localStorage 记忆 ──
  var themeMode = 'auto'
  try { themeMode = localStorage.getItem('tintin-browser-theme') || 'auto' } catch { /* 无存储保持 auto */ }
  function applyTheme() {
    if (themeMode === 'auto') {
      document.documentElement.removeAttribute('data-theme')
      $('themeBtn').textContent = '◐'
    } else {
      document.documentElement.setAttribute('data-theme', themeMode)
      $('themeBtn').textContent = themeMode === 'dark' ? '🌙' : '☀'
    }
    $('themeBtn').title = '主题（当前：' + (themeMode === 'auto' ? '跟随系统' : themeMode === 'dark' ? '深色' : '浅色') + '，点击切换）'
    try { localStorage.setItem('tintin-browser-theme', themeMode) } catch { /* ignore */ }
  }
  $('themeBtn').onclick = function () {
    themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto'
    applyTheme()
  }
  applyTheme()

  // ── 设置（2026-11-08 第一批 P0「设置入口」；存储在壳侧 settings.json，代理保存即生效）──
  function stFillPlatformSelect() {
    var sel = document.getElementById('setClearPlatform')
    var cur = sel.value
    sel.textContent = ''
    var all = document.createElement('option'); all.value = 'all'; all.textContent = '全部平台'; sel.appendChild(all)
    platforms.forEach(function (p) {
      var o = document.createElement('option'); o.value = p.id; o.textContent = p.name || p.id; sel.appendChild(o)
    })
    sel.value = cur
    if (!sel.value) sel.value = 'all'
  }
  function stApply(s) {
    pageSettings = s || {}
    $('setHome').value = pageSettings.homepage || ''
    $('setSearch').value = pageSettings.searchEngine || 'baidu'
    $('setProxyMode').value = pageSettings.proxyMode || 'system'
    $('setProxyRules').value = pageSettings.proxyRules || ''
    $('setProxyRules').style.display = $('setProxyMode').value === 'manual' ? '' : 'none'
    if (pageSettings.downloadsDir) $('setDlDir').textContent = pageSettings.downloadsDir
    stFillPlatformSelect()
  }
  function stLoad() {
    if (!bridge || !bridge.getSettings) return
    bridge.getSettings().then(stApply).catch(function () { /* 桥不可达保持原状 */ })
  }
  $('setHomeSave').onclick = function () {
    if (!bridge) return
    bridge.setSettings({ homepage: $('setHome').value.trim() }).then(function (s) { stApply(s); toast('已保存') }).catch(function (e) { toast('保存失败：' + (e && e.message || e)) })
  }
  $('setSearch').onchange = function () {
    if (!bridge) return
    bridge.setSettings({ searchEngine: this.value }).then(function (s) { stApply(s); toast('已保存') }).catch(function () {})
  }
  $('setProxyMode').onchange = function () { $('setProxyRules').style.display = this.value === 'manual' ? '' : 'none' }
  $('setProxyApply').onclick = function () {
    if (!bridge) return
    bridge.setSettings({ proxyMode: $('setProxyMode').value, proxyRules: $('setProxyRules').value.trim() }).then(function (s) {
      stApply(s)
      toast($('setProxyMode').value === 'manual' && !$('setProxyRules').value.trim() ? '手动模式需填代理地址' : '代理已应用')
    }).catch(function (e) { toast('应用失败：' + (e && e.message || e)) })
  }
  $('setClearBtn').onclick = function () {
    if (!bridge) return
    var storages = []
    if ($('setClearCookies').checked) storages.push('cookies')
    if ($('setClearCache').checked) storages.push('cachestorage')
    if ($('setClearLs').checked) storages.push('localstorage')
    if (!storages.length) { toast('先勾选要清除的数据类型'); return }
    if (storages.indexOf('cookies') >= 0 && !window.confirm('清除 Cookie 将退出对应平台登录（下载链的登录态也会失效），确定？')) return
    bridge.clearData({ platform: $('setClearPlatform').value, storages: storages }).then(function (r) {
      if (r && r.success) { toast('已清除 ' + (r.cleared || 0) + ' 个分区'); refreshLogin() }
      else toast((r && r.error) || '清除失败')
    }).catch(function (e) { toast('清除失败：' + (e && e.message || e)) })
  }
  $('setDlOpen').onclick = function () { if (bridge) bridge.openDownloadsDir() }

  // ── 左栏：平台 + 功能扩展 ──
  var EXT_ITEMS = [
    { id: 'autolisting', name: '自动上架', badge: '⬆' },
    { id: 'collect', name: '素材采集', badge: '🧺' },
    { id: 'extensions', name: '扩展管理', badge: '🧩' },
    { id: 'settings', name: '设置', badge: '⚙' },
  ]
  function paintSidebar() {
    var list = $('platList')
    list.textContent = ''
    platforms.forEach(function (p) {
      var b = document.createElement('button')
      b.className = 'plat-btn' + (currentId === p.id ? ' active' : '')
      b.innerHTML = '<span class="plat-badge"></span><span class="plat-name"></span><span class="plat-state"></span>'
      b.querySelector('.plat-badge').textContent = (p.name || p.id).slice(0, 1)
      b.querySelector('.plat-name').textContent = p.name
      var st = b.querySelector('.plat-state')
      var n = (window.__loginCounts || {})[p.id] || 0
      st.textContent = n > 0 ? '已登录' : '未登录'
      b.onclick = function () {
        switchView('browser')
        // 嗅探目标跟随当前平台（2026-11-04 修复：原调用误在构建循环里执行，恒锁最后一个平台）
        sniffWatch(p.id)
        if (page) page.open({ platform: p.id })
      }
      list.appendChild(b)
    })
    var ext = $('extList')
    ext.textContent = ''
    EXT_ITEMS.forEach(function (it) {
      var b = document.createElement('button')
      b.className = 'plat-btn' + (activeViewName === it.id ? ' active' : '')
      b.innerHTML = '<span class="plat-badge"></span><span class="plat-name"></span>'
      b.querySelector('.plat-badge').textContent = it.badge
      b.querySelector('.plat-name').textContent = it.name
      b.onclick = function () { switchView(it.id) }
      ext.appendChild(b)
    })
  }
  function switchView(name) {
    activeViewName = name
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + name) })
    paintSidebar()
    sendBounds()
    if (name === 'collect') clLoad()
    else if (name === 'history') hsLoad()
    else if (name === 'extensions') extMgrLoad()
    else if (name === 'settings') stLoad()
  }

  // 「服务端」按钮已按 2026-11-08 用户裁决整体移除（含壳侧 server 动作与 resolveServerUrl 注入链）

  // ── 登录态 ──
  function refreshLogin() {
    if (!bridge) return
    bridge.loginStatus().then(function (st) {
      window.__loginCounts = st.counts || {}
      paintSidebar()
    }).catch(function () { /* 桥不可达保持原状 */ })
  }

  // ── 下载栏 ──
  function fmtSpeed(n) {
    // media-downloader 的 speed 字段承载进度消息字符串（"下载中 1.2 MB/s"/"视频 50% · 音频 30%"），
    // 原按数字计算对字符串得 NaN（2026-11-11 报障红框区域）：字符串即展示文案，数字才走速率格式化
    if (typeof n === 'string') return n
    if (!n || n <= 0) return ''
    return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB/s' : Math.round(n / 1024) + ' KB/s'
  }
  function paintShelf() {
    var list = Object.keys(downloads).map(function (k) { return downloads[k] })
    var active = list.filter(function (d) { return d.state === 'downloading' || d.state === 'paused' }).length
    var badge = $('dlBadge')
    badge.style.display = active > 0 ? 'block' : 'none'
    badge.textContent = String(active)
    var el = $('shelf')
    if (!list.length) { el.style.display = 'none'; el.textContent = ''; return }
    el.style.display = 'flex'
    el.textContent = ''
    list.forEach(function (d) {
      var row = document.createElement('div')
      row.className = 'dl ' + d.state
      var meta = d.state === 'downloading' ? (d.percent + '%' + (fmtSpeed(d.speed) ? ' · ' + fmtSpeed(d.speed) : ''))
        : d.state === 'paused' ? ('已暂停 ' + d.percent + '%')
        : d.state === 'done' ? '已完成 ✓' : '下载失败'
      row.innerHTML = '<span class="name"></span><span class="track"><span class="fill"></span></span><span class="meta"></span>'
      row.querySelector('.name').textContent = d.file || '下载文件'
      row.querySelector('.fill').style.width = Math.max(0, Math.min(100, d.percent)) + '%'
      row.querySelector('.meta').textContent = meta

        ...(r.platformId ? { platformId: r.platformId, subDir: r.platformId } : { subDir: 'video' })
      }).then(function (d) {
        btn.disabled = false; btn.textContent = '下载视频'
        var ok = !!(d && d.success)
        dySetMsg(ok, ok ? '已开始下载（进度见底部下载栏）' : ((d && d.error) || '下载发起失败'))
        if (!ok) toast((d && d.error) || '下载发起失败')
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = '下载视频'
        var m = '下载发起失败：' + (e && e.message || e)
        dySetMsg(false, m); toast(m)
      })
      return
    }
    // 视频页路线（2026-11-07 修复）：上游 yt-dlp 抖音抽取器不会算 a_bogus 签名
    // （tiktok.py 源码 TODO 明写），裸请求 aweme/detail 必 403 误报 Fresh cookies；
    // 第三方解析 API 也已失联。改走自家已验证链路：打开视频页 → 嗅探捕获播放地址
    // → sniffDownload 流式下载（分区 cookie+referer）。直链路线保留（API 复活时用）。
    if (r.videoPageUrl) { dyStartSniffDownload(r, btn); return }
    btn.disabled = true; btn.textContent = '下载中…'
    var baseName = String(r.desc || r.author || ('douyin_video_' + Date.now())).slice(0, 40).replace(/[\\/:*?"<>|\s]+/g, '_') || ('douyin_video_' + Date.now())
    var params = { url: r.videoUrl, filename: baseName + '.mp4', referer: 'https://www.douyin.com/', platformId: 'douyin', subDir: 'douyin', useYtdlp: false }
    bridge.downloadMediaStart(params).then(function (d) {
      btn.disabled = false; btn.textContent = '下载视频'
      var ok = !!(d && d.success)
      dySetMsg(ok, ok ? '已开始下载（进度见底部下载栏）' : ((d && d.error) || '下载发起失败'))
      if (!ok) toast((d && d.error) || '下载发起失败')
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '下载视频'
      var m = '下载发起失败：' + (e && e.message || e)
      dySetMsg(false, m); toast(m)
    })
  }
  // 打开视频页 → 轮询嗅探缓冲捕获新出现的播放地址 → sniffDownload（25s 超时给指引）
  function dyStartSniffDownload(r, btn) {
    dySetMsg(true, '后台捕获窗口已开，正在捕获播放地址…（当前页面不受影响）')
    btn.disabled = true; btn.textContent = '捕获中…'
    // 后台捕获（2026-11-11 用户裁决方案 1）：捕获页走独立隐藏 BrowserWindow，
    // 不进标签池、不挂页面宿主、不推 tabs/state —— 用户当前视图/地址栏零感知
    // （旧实现是 tabOpen background=true，空标签池时会被扶正并贴到主区，把正在
    //  播放的页面换掉）。自动起播注入见 sniff-capture.ts。
    if (!page || !page.captureOpen) {
      dySetMsg(false, '客户端缺少后台捕获通道，请更新客户端')
      btn.disabled = false; btn.textContent = '下载视频'
      return
    }
    var capId = null
    var base = null
    var baseReady = false
    var polls = 0
    var timer = null
    bridge.sniffList('douyin').then(function (res) {
      base = {}
      ;((res && res.data) || []).forEach(function (x) { base[x.url] = true })
      baseReady = true
    }).catch(function () { base = {}; baseReady = true })
    page.captureOpen({ platform: 'douyin', url: r.videoPageUrl, autoplay: true }).then(function (tr) {
      capId = tr && tr.ok ? tr.captureId : null
      if (capId) return
      if (timer) clearInterval(timer)
      dySetMsg(false, (tr && tr.error) || '后台捕获窗口打开失败'); btn.disabled = false; btn.textContent = '下载视频'
    }).catch(function (e) {
      if (timer) clearInterval(timer)
      dySetMsg(false, '后台捕获窗口打开失败：' + (e && e.message || e)); btn.disabled = false; btn.textContent = '下载视频'
    })
    timer = setInterval(function () {
      polls++
      if (!baseReady) return
      bridge.sniffList('douyin').then(function (res) {
        var items = (res && res.data) || []
        // 音视频配对（2026-11-08 报障修复）：抖音播放器同时发视频流+音频流（原「抓第一条」
        // 命中先到的音频流→只下音频且秒完成无进度）。差分里：badge=视频的第一条=主视频流，
        // 同批新出现的音频流作为 audioUrl 一并交给引擎 → 双流下载+FFmpeg 合并（B站扩展链同款）。
        var fresh = items.filter(function (x) { return !base[x.url] })
        var hit = null, audio = null
        for (var i = 0; i < fresh.length; i++) {
          if (fresh[i].type !== 'audio' && !hit) hit = fresh[i]
          else if (fresh[i].type === 'audio' && !audio) audio = fresh[i]
          if (hit && audio) break
        }
        if (!hit) {
          if (polls >= 25) {
            clearInterval(timer)
            if (page && page.captureClose) page.captureClose({ id: capId })
            capId = null
            btn.disabled = false; btn.textContent = '重试捕获'
            var m = '未捕获到播放地址：后台捕获窗口已开 25 秒（需页面播放一次媒体流），点「重试捕获」再试'
            dySetMsg(false, m); toast('未捕获到播放地址')
          }
          return
        }
        // 等一拍让同批音频流也落进缓冲（视频流常先到 1-2s）
        if (!audio && polls < 6) return
        clearInterval(timer)
        if (page && page.captureClose) page.captureClose({ id: capId })
        capId = null
        // 捕获流就地展示（2026-11-12 用户裁决：捕获结果归助手卡，不再堆顶部嗅探面板）
        dyRenderStreams(hit.url, audio ? audio.url : '')
        // 文案时序（2026-11-12 用户报障）：sniffDownload 要等整段下载+合并完才 resolve，
        // 原把完成误报成「开始下载」——用户以为还要再点一次按钮。捕获命中即刻报
        // 「正在下载」，resolve 后报「下载完成」；下载进度本体在底部下载栏实时可见
        // （2026-11-12 修复：页面下载栏此前收不到 downloads:* 事件，进度从未显示）。
        var paired = !!audio
        dySetMsg(true, '已捕获' + (paired ? '音视频双流' : '视频流') + '，正在下载（进度见底部下载栏）')
        btn.textContent = '下载中…'
        // 平台/Referer 显式声明（2026-11-11：捕获已与用户当前页解耦——在别的平台页面
        // 解析抖音链接时，下载仍必须走抖音分区 cookie + 抖音 referer）
        bridge.sniffDownload({ url: hit.url, ...(paired ? { audioUrl: audio.url } : {}), filename: (r.desc || '抖音视频') + '.mp4', platformId: 'douyin', referer: r.videoPageUrl }).then(function (d) {
          btn.disabled = false; btn.textContent = '下载视频'
          var ok = !!(d && d.success)
          dySetMsg(ok, ok ? '下载完成，无水印 mp4 已存盘（底部下载栏点「打开目录」查看）' : ((d && d.error) || '下载发起失败'))
          if (!ok) toast((d && d.error) || '下载发起失败')
        }).catch(function (e) {
          btn.disabled = false; btn.textContent = '下载视频'
          var m = '下载发起失败：' + (e && e.message || e)
          dySetMsg(false, m); toast(m)
        })
      }).catch(function () { /* 桥抖动下一轮再试 */ })
    }, 1000)
  }
  document.getElementById('dyParseBtn').onclick = dyParse
  document.getElementById('dyShare').addEventListener('keydown', function (e) { if (e.key === 'Enter') dyParse() })
  // 扩展管理（SRC extensions-panel.html：列表/内置标识/安装 crx|zip/卸载；独立浮窗改并入本页面视图）
  var extItems = []
  function extMgrLoad() {
    if (!bridge) return
    bridge.extensionList().then(function (r) {
      extItems = (r && r.success && r.data && Array.isArray(r.data.extensions)) ? r.data.extensions : []
      extMgrRender()
    }).catch(function () { /* 桥不可达保持原状 */ })
  }
  function extMgrRender() {
    document.getElementById('extCount').textContent = extItems.length + ' 个'
    var list = document.getElementById('extViewList')
    list.textContent = ''
    if (!extItems.length) {
      list.appendChild(mkEmpty('未安装任何扩展。点右上角「+ 安装扩展」上传 crx 或 zip；B站/抖音下载助手为内置预装，无需安装。'))
      return
    }
    extItems.forEach(function (e) {
      list.appendChild(liCard({
        name: (e.name || e.id) + (e.version ? ' v' + e.version : ''),
        sub: e.description || e.path || '',
        badge: e.builtin ? '内置' : '已装',
        actions: e.builtin ? [] : [
          { label: '卸载', danger: true, on: function () { if (bridge) bridge.extensionUninstall(e.id).then(extMgrLoad) } },
        ],
      }))
    })
  }
  document.getElementById('extInstall').onclick = function () {
    if (!bridge) return
    bridge.extensionPickAndInstall().then(function (r) {
      if (r && r.success) window.alert(r.message || '已安装')
      else if (r && !r.cancelled) window.alert((r && r.message) || '安装失败')
      extMgrLoad()
    }).catch(function (e) { window.alert('安装失败：' + (e && e.message || e)) })
  }
  if (bridge && bridge.onExtensionsChanged) {
    bridge.onExtensionsChanged(function () { extMgrLoad() })
  }

  // ── 素材采集清单（creators:getCollected；达人库已按 2026-11-04 用户裁决移除，
  // 清单保留为既有采集记录的查看面）──
  var clItems = []
  function clLoad() {
    if (!bridge) return
    bridge.creatorsGetCollected().then(function (r) { clItems = (r && r.data) || []; clRender() }).catch(function () {})
  }
  function clRender() {
    document.getElementById('clCount2').textContent = clItems.length + ' 条'
    var list = document.getElementById('clList2')
    if (!list) return
    list.textContent = ''
    if (!clItems.length) { list.appendChild(mkEmpty('采集清单为空。')); return }
    clItems.slice().reverse().slice(0, 200).forEach(function (it) {
      list.appendChild(liCard({
        name: it.title || it.url, sub: it.creatorName + ' · ' + it.date,
        badge: it.platform,
        actions: [
          { label: '打开', on: function () { if (page) page.action({ type: 'go', url: it.url }) } },
        ],
      }))
    })
  }
  clLoad()

  // ── 历史（SRC 历史面板；media:storage 下载+嗅探记录）──
  function mkEmpty(text) {
    var d = document.createElement('div')
    d.className = 'placeholder'
    d.style.padding = '24px 10px'
    d.textContent = text
    return d
  }
  function liCard(o) {
    var card = document.createElement('div'); card.className = 'li-card'
    var main = document.createElement('div'); main.className = 'li-main'
    var nm = document.createElement('div'); nm.className = 'li-name'; nm.textContent = o.name; nm.title = o.name
    var sub = document.createElement('div'); sub.className = 'li-sub'; sub.textContent = o.sub || ''
    main.append(nm, sub)
    var badge = document.createElement('span'); badge.className = 'li-badge'; badge.textContent = o.badge || ''
    card.append(main, badge)
    ;(o.actions || []).forEach(function (a) {
      var b = document.createElement('button')
      b.className = 'li-btn' + (a.danger ? ' danger' : '')
      b.textContent = a.label
      b.onclick = a.on
      card.appendChild(b)
    })
    return card
  }
  var hsData = { visits: [], downloads: [], sniffed: [] }
  function hsLoad() {
    if (!bridge) { hsRender(); return }
    var jobs = [
      bridge.historyList ? bridge.historyList().catch(function () { return null }) : Promise.resolve(null),
      bridge.mediaStorageGetDownloads ? bridge.mediaStorageGetDownloads().catch(function () { return null }) : Promise.resolve(null),
      bridge.mediaStorageGetSniffed ? bridge.mediaStorageGetSniffed().catch(function () { return null }) : Promise.resolve(null),
    ]
    Promise.all(jobs).then(function (rs) {
      hsData.visits = (rs[0] && rs[0].success && Array.isArray(rs[0].data)) ? rs[0].data : []
      hsData.downloads = (rs[1] && rs[1].success && Array.isArray(rs[1].data)) ? rs[1].data : []
      hsData.sniffed = (rs[2] && rs[2].success && Array.isArray(rs[2].data)) ? rs[2].data : []
      hsRender()
    }).catch(function () { hsRender() })
  }
  function hsRender() {
    document.getElementById('hsCount').textContent = '访问 ' + hsData.visits.length + ' · 下载 ' + hsData.downloads.length + ' · 嗅探 ' + hsData.sniffed.length
    var list = document.getElementById('hsList')
    list.textContent = ''
    if (!hsData.visits.length && !hsData.downloads.length && !hsData.sniffed.length) { list.appendChild(mkEmpty('暂无记录（浏览/下载/嗅探后在此显示）')); return }
    hsData.visits.slice(0, 50).forEach(function (v) {
      list.appendChild(liCard({
        name: v.title || v.url, sub: v.url || '',
        badge: '访问',
        actions: [
          { label: '打开', on: function () { nav('go', v.url) } },
        ],
      }))
    })
    hsData.downloads.slice(0, 30).forEach(function (d) {
      list.appendChild(liCard({
        name: d.name || d.fileName || d.id, sub: (d.path || '') + (d.size ? ' · ' + d.size + 'B' : ''),
        badge: '下载', actions: [{ label: '定位', on: function () { if (d.path && bridge) bridge.revealDailyAsset(d.path) } }],
      }))
    })
    hsData.sniffed.slice(0, 30).forEach(function (m) {
      list.appendChild(liCard({ name: m.name || m.url, sub: m.url || '', badge: m.type === 'audio' ? '音频' : '嗅探' }))
    })
  }
  document.getElementById('hsRefresh').onclick = function () { hsLoad() }
  hsLoad()

  // ── 启动 ──
  if (bridge && bridge.getSettings) bridge.getSettings().then(stApply).catch(function () {})
  if (bridge) {
    bridge.platforms().then(function (list) {
      platforms = Array.isArray(list) ? list : []
      paintSidebar()
      refreshLogin()
    }).catch(function () { paintSidebar() })
  } else {
    paintSidebar()
  }
  sendBounds()
  setInterval(refreshLogin, 15000)
})()
</script>
</body>
