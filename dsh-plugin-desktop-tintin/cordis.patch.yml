# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop-tintin
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop-tintin/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop-tintin/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop-tintin/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop-tintin/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop-tintin/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop-tintin/updates
    # TinTin port: host bridge and the two view sub-applications
    # (docs/tintin-migration-plan.md). Each mounted package that declares
    # dsh.client joins the web boot graph; the ops bundle registers 'ops'.
    # 素材创作包已整体移除（2026-11-20 用户裁决；git 历史 ≤4976a1f7c4 可考）。
    - id: tintin-client-ui
      name: dsh-tintin-client-ui
    - id: tintin-host
      name: dsh-tintin-bundle
    - id: tintin-media
      name: dsh-tintin-media-bundle
    - id: tintin-ops
      name: dsh-tintin-ops-bundle
    # 封面制作独立插件(2026-10-30 用户裁决):宿主入口挂封面路由族/会话桥/工具组,
    # web 入口自注册 'cover' 视图;Remotion 引擎与编辑器载荷仍走通道 staging 资源。
    - id: tintin-cover
      name: dsh-tintin-cover-plugin

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
